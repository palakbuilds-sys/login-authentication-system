<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h2>Welcome Back</h2>

  <form id="loginForm">

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      required
    >

    <button type="submit">Login</button>

  </form>

  <p>
    Don't have an account?
    <a href="register.html">Register</a>
  </p>

  <p id="loginMessage"></p>

</div>

<script src="script.js"></script>

</body>
</html>
